<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <nav>
        <div class="main_nav container flex">
            <a href="#" onclick="reload()" class="company-logo">
                
                    <!-- <center><img src="images-removebg-preview.png" alt="logo" width="100" height="100"class="logo"></center>
         -->
         <div class="logo-wrapper">
            <img src="11894385.png" alt="Logo" class="logo" />
          </div>
                

            </a>
            <div class="nav_links">
                <ul class="flex">
                    <li class="hover_link nav_item" id="india" onclick="onNavItemClick('india')">India</li>
                    <li class="hover_link nav_item" id="world" onclick="onNavItemClick('world')">World</li>
                    <li class="hover_link nav_item" id="ipl" onclick="onNavItemClick('ipl')">IPL</li>
                    <li class="hover_link nav_item" id="finance" onclick="onNavItemClick('finance')">Finance</li>
                    <li class="hover_link nav_item" id="politics" onclick="onNavItemClick('politics')">Politics</li>
                    
                    <li class="hover_link nav_item" id="health" onclick="onNavItemClick('health')">Health</li>
                    <li class="hover_link nav_item" id="business" onclick="onNavItemClick('business')">Business</li>
                    <li class="hover_link nav_item" id="movies" onclick="onNavItemClick('movies')">Movies</li>
                    
                </ul>
             </div>
           
            <div class="search_bar flex">
                <div class="search_icon_section">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="search_input_section">
                    <input id="search-text" type="text" class="news_input" placeholder="Search">
                </div>
            </div>
            <button id="logout-btn" class="logout-btn">Logout</button>
          
            
        </div>
    </nav>
    

    <main>
        
        <div class="cards-container container flex" id="cards-container">
                
        </div>
        
    </main>
    <template id="template-news-card">
        <div class="card">
            <div class="card-header">
                <img src="" alt="News image" id="news-img">
            </div>
            <div class="card-content">
                <h3 id="news-title">This is the title</h3>
                <h6 class="news-source" id="news-source">
                    End Gadget 26/08/2023
                </h6>
                <p class="news-desc" id="news-desc">News description...</p>
            </div>
        </div>
    </template>
    <script src="script.js"></script>
</body>
</html>
